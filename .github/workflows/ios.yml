name: iOS

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run frontend and host Rust tests; disable only to reuse passed checks for unchanged app source
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verified-build:
    name: Checks, simulator app, and unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Prepare build archive
        run: |
          archive="$HOME/CodexArtifacts/vcpchat-ios-${GITHUB_RUN_ID}"
          mkdir -p "$archive/results" "$archive/products" "$archive/tmp"
          mv "$GITHUB_WORKSPACE/source" "$archive/source"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$archive/source" >> "$GITHUB_ENV"
          echo "TMPDIR=$archive/tmp/" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SOURCE_ROOT }}/src-tauri
      - name: Record build environment
        run: |
          cd "$SOURCE_ROOT"
          {
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list runtimes
            rustc -V
            cargo -V
            node -v
            pnpm -v
            git log -1 --format='%H %s'
            df -h .
          } 2>&1 | tee "$ARCHIVE/results/environment.log"
      - name: "1. pnpm install"
        run: |
          cd "$SOURCE_ROOT"
          pnpm install 2>&1 | tee "$ARCHIVE/results/1-pnpm-install.log"
      - name: "2. pnpm check"
        if: inputs.run_checks
        run: |
          cd "$SOURCE_ROOT"
          pnpm check 2>&1 | tee "$ARCHIVE/results/2-pnpm-check.log"
      - name: "3. Rust library tests (locked)"
        if: inputs.run_checks
        run: |
          cd "$SOURCE_ROOT"
          cargo test --lib --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$ARCHIVE/results/3-cargo-test.log"
      - name: "4. Build iOS simulator app"
        run: |
          cd "$SOURCE_ROOT"
          bash scripts/build-ios-simulator.sh 2>&1 | tee "$ARCHIVE/results/4-ios-simulator.log"
          app="src-tauri/gen/apple/build/arm64-sim/VCPChat.app"
          test -f "$app/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$ARCHIVE/products/VCPChat-simulator.app.zip"
      - name: "5. Build unsigned device IPA"
        run: |
          cd "$SOURCE_ROOT"
          bash scripts/build-unsigned-ipa.sh 2>&1 | tee "$ARCHIVE/results/5-unsigned-ipa.log"
          cp dist-ios/VCPChat-unsigned.ipa "$ARCHIVE/products/"
      - name: Install and launch simulator app
        run: |
          cd "$SOURCE_ROOT"
          bash scripts/smoke-ios-simulator.sh \
            src-tauri/gen/apple/build/arm64-sim/VCPChat.app \
            "$ARCHIVE/results" 2>&1 | tee "$ARCHIVE/results/6-simulator-smoke.log"
      - name: Record source diff
        if: always()
        run: |
          git -C "$SOURCE_ROOT" diff > "$ARCHIVE/results/build-diff.patch"
          git -C "$SOURCE_ROOT" diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - name: Save available build products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VCPChat-iOS-products
          path: ${{ env.ARCHIVE }}/products/*
          if-no-files-found: warn
          retention-days: 14
      - name: Save complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VCPChat-iOS-logs
          path: ${{ env.ARCHIVE }}/results/
          if-no-files-found: error
          retention-days: 14
