name: Native iOS Build
on:
  pull_request:
    paths: ['Sources/**', 'Companion/**', 'ReplyActivity/**', 'IntegrationTests/**', 'UITests/**', 'Vendor/**', 'Configuration/**', 'VChat.xcodeproj/**', 'Package.*', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      verify:
        description: Run simulator and companion plugin tests instead of packaging
        type: boolean
        default: false
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: node --test IntegrationTests/ReplySync/plugin.test.cjs
  native:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated outputs
        run: |
          echo "VCHAT_ARTIFACTS=$HOME/CodexArtifacts/vchat-native-ci-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Xcode environment
        run: |
          mkdir -p "$VCHAT_ARTIFACTS/results"
          sw_vers | tee "$VCHAT_ARTIFACTS/results/environment.log"
          xcodebuild -version | tee -a "$VCHAT_ARTIFACTS/results/environment.log"
          swift -version | tee -a "$VCHAT_ARTIFACTS/results/environment.log"
      - name: Select the iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,group in d["devices"].items() if "iOS-26" in runtime for x in group if "Pro" in x["name"] and "iPhone" in x["name"]))')
          echo "VCHAT_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build the simulator app and its tests together
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project VChat.xcodeproj -scheme VChat -configuration Debug \
            -destination "platform=iOS Simulator,id=$VCHAT_SIMULATOR" \
            -derivedDataPath "$VCHAT_ARTIFACTS/tmp/DerivedData" \
            -clonedSourcePackagesDirPath "$VCHAT_ARTIFACTS/tmp/SourcePackages" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual 2>&1 | tee "$VCHAT_ARTIFACTS/results/ios-build.log"
      - name: Launch native app on simulator
        id: launch
        run: |
          set -euo pipefail
          device="$VCHAT_SIMULATOR"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          app="$VCHAT_ARTIFACTS/tmp/DerivedData/Build/Products/Debug-iphonesimulator/VChat.app"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" app.vcpchat.native | tee "$VCHAT_ARTIFACTS/results/simulator-launch.log"
          sleep 3
          pid=$(awk -F': ' '/^app\.vcpchat\.native:/ { print $2 }' "$VCHAT_ARTIFACTS/results/simulator-launch.log")
          [[ "$pid" =~ ^[0-9]+$ ]]
          xcrun simctl spawn "$device" launchctl list > "$VCHAT_ARTIFACTS/results/simulator-processes.log"
          awk -v pid="$pid" '$1 == pid && index($3,"UIKitApplication:app.vcpchat.native[") == 1 { found=1 } END { exit !found }' "$VCHAT_ARTIFACTS/results/simulator-processes.log"
          mkdir -p "$VCHAT_ARTIFACTS/products"
          xcrun simctl io "$device" screenshot "$VCHAT_ARTIFACTS/products/VChat-iOS.png"
          ditto -c -k --keepParent "$app" "$VCHAT_ARTIFACTS/products/VChat-iOS-simulator.zip"
      - name: Test iPhone interactions and message rendering
        run: |
          set -euo pipefail
          port_file="$VCHAT_ARTIFACTS/tmp/slow-reply-port"
          python3 IntegrationTests/slow-reply.py "$port_file" &
          fixture_pid=$!
          sync_file="$VCHAT_ARTIFACTS/tmp/reply-sync-port"
          node IntegrationTests/ReplySync/fixture.cjs "$sync_file" &
          sync_pid=$!
          trap 'kill "$fixture_pid" "$sync_pid" || true' EXIT
          for i in {1..90}; do
            kill -0 "$fixture_pid" "$sync_pid" || exit 1
            test -s "$port_file" && test -s "$sync_file" && break
            sleep 1
          done
          test -s "$port_file" || { echo "::error::Loopback fixture never became ready"; exit 1; }
          fixture_port=$(cat "$port_file")
          [[ "$fixture_port" =~ ^[1-9][0-9]*$ ]]
          export TEST_RUNNER_VCHAT_STREAM_FIXTURE="http://localhost:$fixture_port"
          export TEST_RUNNER_VCHAT_REPLY_SYNC_FIXTURE="$(cat "$sync_file")"
          curl --fail --silent --max-time 5 -H 'Authorization: Bearer fixture' "$TEST_RUNNER_VCHAT_REPLY_SYNC_FIXTURE/api/plugins/VChatReplySync/capabilities"
          curl --fail --silent --max-time 5 "$TEST_RUNNER_VCHAT_STREAM_FIXTURE/count"
          xcrun simctl privacy "$VCHAT_SIMULATOR" grant photos-add app.vcpchat.native
          xcodebuild test-without-building -project VChat.xcodeproj -scheme VChat -configuration Debug \
            -destination "platform=iOS Simulator,id=$VCHAT_SIMULATOR" \
            -parallel-testing-enabled NO -derivedDataPath "$VCHAT_ARTIFACTS/tmp/DerivedData" \
            -clonedSourcePackagesDirPath "$VCHAT_ARTIFACTS/tmp/SourcePackages" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual 2>&1 | tee "$VCHAT_ARTIFACTS/results/phone-tests.log"
          for scenario in testSaveMarkdownAndHTMLPhotosFromChat testSystemTransferStreamsBeforeCompletionAndCatchesUp testHomeDuringStreamThenReturnBeforeFinish testServerReplySurvivesProcessLossWithoutSecondGeneration testServerReplyUsesDownloadedArchiveWhenLiveReaderIsUnavailable; do
            grep -E "${scenario}.*passed" "$VCHAT_ARTIFACTS/results/phone-tests.log"
          done
      - name: Inspect synthetic reply checkpoints on failure
        if: failure() && steps.launch.outcome == 'success'
        run: |
          container=$(xcrun simctl get_app_container "$VCHAT_SIMULATOR" app.vcpchat.native data)
          python3 IntegrationTests/ReplySync/inspect-fixture.py "$container" | tee "$VCHAT_ARTIFACTS/results/reply-fixtures.log"
          xcrun simctl spawn "$VCHAT_SIMULATOR" log show --last 20m --predicate 'subsystem == "app.vcpchat.native.fixture"' --style compact > "$VCHAT_ARTIFACTS/results/reply-recovery.log"
      - name: Save simulator app
        if: ${{ !cancelled() && steps.launch.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VChat-iOS-simulator
          path: |
            ~/CodexArtifacts/vchat-native-ci-${{ github.run_id }}/products/VChat-iOS-simulator.zip
            ~/CodexArtifacts/vchat-native-ci-${{ github.run_id }}/products/VChat-iOS.png
          if-no-files-found: error
      - name: Build unsigned iPhone app
        if: inputs.verify != true
        run: |
          set -o pipefail
          xcodebuild -project VChat.xcodeproj -scheme VChat -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$VCHAT_ARTIFACTS/tmp/DeviceDerivedData" \
            -clonedSourcePackagesDirPath "$VCHAT_ARTIFACTS/tmp/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$VCHAT_ARTIFACTS/results/iphone-build.log"
      - name: Package unsigned IPA
        if: inputs.verify != true
        id: ipa
        run: |
          set -euo pipefail
          app="$VCHAT_ARTIFACTS/tmp/DeviceDerivedData/Build/Products/Release-iphoneos/VChat.app"
          test -x "$app/VChat"
          xcrun lipo "$app/VChat" -verify_arch arm64
          xcrun lipo "$app/PlugIns/ReplyActivity.appex/ReplyActivity" -verify_arch arm64
          atlas_page=$(find "$app" -type f -path '*/FieldAtlas/index.html' -print)
          test -s "$atlas_page" || { echo "::error::Missing packaged FieldAtlas/index.html"; exit 1; }
          for asset in metric-slice.js atlas-app.js mobile.js atlas.css mobile.css; do
            test -s "$(dirname "$atlas_page")/$asset" || { echo "::error::Missing packaged FieldAtlas/$asset"; exit 1; }
          done
          mkdir -p "$VCHAT_ARTIFACTS/tmp/ipa/Payload" "$VCHAT_ARTIFACTS/products"
          ditto "$app" "$VCHAT_ARTIFACTS/tmp/ipa/Payload/VChat.app"
          (cd "$VCHAT_ARTIFACTS/tmp/ipa" && zip -qry "$VCHAT_ARTIFACTS/products/VChat-unsigned.ipa" Payload)
          unzip -t "$VCHAT_ARTIFACTS/products/VChat-unsigned.ipa"
      - name: Save unsigned IPA
        if: ${{ !cancelled() && steps.ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VChat-iOS-unsigned
          path: ~/CodexArtifacts/vchat-native-ci-${{ github.run_id }}/products/VChat-unsigned.ipa
          if-no-files-found: error
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VChat-build-logs
          path: ~/CodexArtifacts/vchat-native-ci-${{ github.run_id }}/results/
          if-no-files-found: warn
