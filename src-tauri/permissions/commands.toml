[[permission]]
identifier = "allow-start-chat-stream"
description = "Start a streaming chat request through the native HTTP client."
commands.allow = ["start_chat_stream"]

[[permission]]
identifier = "allow-cancel-chat-stream"
description = "Cancel a streaming chat request."
commands.allow = ["cancel_chat_stream"]

[[permission]]
identifier = "allow-chat-stream-snapshot"
description = "Read what a running or finished chat stream has produced so far."
commands.allow = ["chat_stream_snapshot"]

[[permission]]
identifier = "allow-release-chat-stream"
description = "Forget a finished chat stream after the reply is saved."
commands.allow = ["release_chat_stream"]

[[permission]]
identifier = "allow-http-request"
description = "Send a bounded HTTP request to the configured server."
commands.allow = ["http_request"]

[[permission]]
identifier = "allow-socket-connect"
description = "Open a VCP WebSocket channel."
commands.allow = ["socket_connect"]

[[permission]]
identifier = "allow-socket-disconnect"
description = "Close a VCP WebSocket channel."
commands.allow = ["socket_disconnect"]

[[permission]]
identifier = "allow-socket-send"
description = "Send an explicit tool approval response on the connected VCPLog channel."
commands.allow = ["socket_send"]

[[permission]]
identifier = "allow-audio-request"
description = "Fetch bounded binary audio from the configured speech service."
commands.allow = ["audio_request"]

[[permission]]
identifier = "allow-sync-http-request"
description = "Exchange bounded foreground MobileSync data with the configured desktop."
commands.allow = ["sync_http_request"]
[[permission]]
identifier = "allow-binary-request"
description = "Transfer bounded avatar and file bytes through native HTTP."
commands.allow = ["binary_request"]
[[permission]]
identifier = "allow-export-file"
description = "Save a new, non-overwriting file copy in the app export directory."
commands.allow = ["export_file"]
[[permission]]
identifier = "allow-show-exports"
description = "Show the app-owned export directory."
commands.allow = ["show_exports"]

[[permission]]
identifier = "allow-connected-folders"
description = "Manage user-picked folders through scoped native access with pre-change backups."
commands.allow = ["folder_request", "folder_tool"]
