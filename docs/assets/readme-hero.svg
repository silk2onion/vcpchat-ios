    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#b0e8ca"/><stop offset="1" stop-color="#73bcd0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#88d6b0" stop-opacity=".12"/><stop offset="1" stop-color="#88d6b0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="966" cy="180" r="250" fill="url(#glow)"/>
  <g fill="none" stroke="#88d6b0">
